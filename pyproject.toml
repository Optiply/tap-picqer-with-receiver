[tool.poetry]
name = "tap-picqer"
version = "0.0.2"
description = "`tap-picqer` is a Singer tap for Picqer, built with the Hotglue Singer SDK."
authors = ["Mário Costa", "Alvaro Valarezo"]
keywords = [
    "ELT",
    "picqer",
]
license = "Apache 2.0"

[tool.poetry.dependencies]
python = ">=3.9,<3.11"
requests = "^2.25.1"
hotglue-singer-sdk = "1.0.54"
tap-firestore = {git = "https://github.com/mariocostaoptiply/tap-firestore.git", branch = "pilot/hotglue-sdk"}

[tool.poetry.dev-dependencies]
pytest = "^7.4.4"
tox = "^3.24.4"
flake8 = "^3.9.2"
black = "^24.8.0"
pydocstyle = "^6.1.1"
mypy = "^0.910"
types-requests = "^2.26.1"
isort = "^5.10.1"

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "tap_picqer"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration
tap-picqer = 'tap_picqer.tap:Tappicqer.cli'
